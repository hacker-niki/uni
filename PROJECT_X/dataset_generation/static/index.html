<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3949 0%, #f45c43 100%);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
        }

        .questions-grid {
            display: grid;
            gap: 20px;
        }

        .question-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
            transition: all 0.3s;
        }

        .question-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .question-card-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .question-text {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            line-height: 1.5;
        }

        .answers-list {
            list-style: none;
            margin-top: 15px;
        }

        .answer-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: white;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-item.correct {
            background: #d4edda;
            border-color: #28a745;
            font-weight: 600;
        }

        .answer-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
        }

        .answer-item.correct .answer-indicator {
            background: #28a745;
            color: white;
        }

        .answer-item:not(.correct) .answer-indicator {
            background: #e0e0e0;
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: auto;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab:hover {
            color: #667eea;
            transform: none;
            box-shadow: none;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dataset Generator</h1>
            <p>Генерация и управление датасетом вопросов</p>
        </div>

        <div class="content">
            <div class="section">
                <h2>Генерация вопросов</h2>
                <textarea id="inputText" placeholder="Вставьте текст для генерации вопросов..."></textarea>
                <button onclick="generateQuestions()" id="generateBtn">Генерировать вопросы</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('pending')">На проверке</button>
                <button class="tab" onclick="switchTab('approved')">Утверждённые</button>
            </div>

            <div class="section">
                <div id="pendingTab" class="tab-content active">
                    <div class="button-group">
                        <button onclick="approveSelected()" class="btn-success">Утвердить выбранные</button>
                        <button onclick="loadQuestions(false)" class="btn-secondary">Обновить</button>
                    </div>
                    <div id="pendingQuestions"></div>
                </div>

                <div id="approvedTab" class="tab-content">
                    <div class="stats" id="stats"></div>
                    <div class="button-group">
                        <button onclick="exportDataset()" class="btn-success">Экспортировать датасет</button>
                        <button onclick="loadQuestions(true)" class="btn-secondary">Обновить</button>
                    </div>
                    <div id="approvedQuestions"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'pending';
        const selectedQuestions = new Set();

        async function generateQuestions() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('Пожалуйста, введите текст');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = 'Генерация...';

            const pendingDiv = document.getElementById('pendingQuestions');
            pendingDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Генерация вопросов из текстовых чанков...</div>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка генерации');
                }

                const data = await response.json();
                await loadQuestions(false);
                document.getElementById('inputText').value = '';

                let message = `Успешно сгенерировано ${data.total_questions} вопросов!\n\n`;
                message += `Всего чанков: ${data.chunks_processed}\n`;
                message += `Успешно обработано: ${data.successful_chunks}\n`;
                if (data.failed_chunks > 0) {
                    message += `Пропущено с ошибками: ${data.failed_chunks}`;
                }

                alert(message);
            } catch (error) {
                alert('Ошибка: ' + error.message);
                pendingDiv.innerHTML = '';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Генерировать вопросы';
            }
        }

        async function loadQuestions(approvedOnly) {
            const container = approvedOnly ?
                document.getElementById('approvedQuestions') :
                document.getElementById('pendingQuestions');

            container.innerHTML = '<div class="loading"><div class="spinner"></div>Загрузка...</div>';

            try {
                const response = await fetch(`/api/questions?approved_only=${approvedOnly}`);
                const data = await response.json();

                if (data.questions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <p>${approvedOnly ? 'Нет утверждённых вопросов' : 'Нет вопросов на проверке'}</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '<div class="questions-grid"></div>';
                const grid = container.querySelector('.questions-grid');

                data.questions.forEach(q => {
                    const card = createQuestionCard(q, approvedOnly);
                    grid.appendChild(card);
                });

                if (approvedOnly) {
                    updateStats(data.questions.length);
                }
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>Ошибка загрузки: ${error.message}</p></div>`;
            }
        }

        function createQuestionCard(question, isApproved) {
            const card = document.createElement('div');
            card.className = 'question-card';
            if (selectedQuestions.has(question.id)) {
                card.classList.add('selected');
            }

            const header = document.createElement('div');
            header.className = 'question-card-header';

            if (!isApproved) {
                const checkboxWrapper = document.createElement('div');
                checkboxWrapper.className = 'checkbox-wrapper';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = selectedQuestions.has(question.id);
                checkbox.onchange = (e) => {
                    if (e.target.checked) {
                        selectedQuestions.add(question.id);
                        card.classList.add('selected');
                    } else {
                        selectedQuestions.delete(question.id);
                        card.classList.remove('selected');
                    }
                };
                checkboxWrapper.appendChild(checkbox);
                header.appendChild(checkboxWrapper);
            }

            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = question.question;
            header.appendChild(questionText);

            if (!isApproved) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = () => deleteQuestion(question.id);
                header.appendChild(deleteBtn);
            }

            card.appendChild(header);

            const answersList = document.createElement('ul');
            answersList.className = 'answers-list';

            question.answers.forEach((answer, index) => {
                if (answer.text) {
                    const li = document.createElement('li');
                    li.className = 'answer-item';
                    if (answer.is_correct) {
                        li.classList.add('correct');
                    }

                    const indicator = document.createElement('span');
                    indicator.className = 'answer-indicator';
                    indicator.textContent = answer.is_correct ? '✓' : (index + 1);
                    li.appendChild(indicator);

                    const text = document.createElement('span');
                    text.textContent = answer.text;
                    li.appendChild(text);

                    answersList.appendChild(li);
                }
            });

            card.appendChild(answersList);
            return card;
        }

        async function approveSelected() {
            if (selectedQuestions.size === 0) {
                alert('Выберите вопросы для утверждения');
                return;
            }

            try {
                const response = await fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question_ids: Array.from(selectedQuestions) })
                });

                if (!response.ok) throw new Error('Ошибка утверждения');

                selectedQuestions.clear();
                await loadQuestions(false);
                alert('Вопросы утверждены');
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('Удалить вопрос?')) return;

            try {
                const response = await fetch(`/api/questions/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Ошибка удаления');

                selectedQuestions.delete(id);
                await loadQuestions(false);
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        async function exportDataset() {
            try {
                const response = await fetch('/api/export');
                const data = await response.json();

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dataset.json';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('Ошибка экспорта: ' + error.message);
            }
        }

        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            if (tab === 'pending') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('pendingTab').classList.add('active');
                loadQuestions(false);
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('approvedTab').classList.add('active');
                loadQuestions(true);
            }
        }

        function updateStats(count) {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${count}</div>
                    <div class="stat-label">Утверждённых вопросов</div>
                </div>
            `;
        }

        // Загрузка при старте
        loadQuestions(false);
    </script>
</body>
</html>
