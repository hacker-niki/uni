<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Результат теста</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Manrope,sans-serif;background:#f8fafc;padding:40px 20px}.container{max-width:700px;margin:0 auto}.result-card{background:#fff;border-radius:24px;padding:50px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.1)}.success-icon{font-size:5rem;margin-bottom:20px}.congrats{font-size:2rem;font-weight:800;color:#0f172a;margin-bottom:10px}.subtitle{color:#64748b;font-size:1.1rem;margin-bottom:40px}.score-circle{width:200px;height:200px;margin:0 auto 40px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;position:relative}.score-value{font-size:4rem;font-weight:800;color:#fff}.score-label{color:#fff;font-size:.9rem;opacity:.9;position:absolute;bottom:40px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0;padding:30px;background:#f8fafc;border-radius:16px}.stat{text-align:center}.stat-value{font-size:1.8rem;font-weight:700;color:#667eea}.stat-label{color:#64748b;font-size:.9rem;margin-top:5px}.btn{padding:16px 32px;border:none;border-radius:12px;font-weight:600;cursor:pointer;transition:all .3s;font-size:1rem}.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin-right:10px}.btn-secondary{background:#f1f5f9;color:#334155}.btn:hover{transform:translateY(-2px)}</style>
</head>
<body>
<div class="container">
<div class="result-card">
<div class="success-icon">🎉</div>
<h1 class="congrats">Поздравляем!</h1>
<p class="subtitle">Вы успешно завершили тест "Основы SQL"</p>
<div class="score-circle"><div class="score-value">85<span style="font-size:2rem">%</span></div><div class="score-label">Ваш результат</div></div>
<div class="stats-grid">
<div class="stat"><div class="stat-value">20</div><div class="stat-label">Всего вопросов</div></div>
<div class="stat"><div class="stat-value">17</div><div class="stat-label">Правильных</div></div>
<div class="stat"><div class="stat-value">28:45</div><div class="stat-label">Время</div></div>
</div>
<p style="color:#64748b;margin:20px 0">Тест пройден успешно! Вы показали хороший результат. Продолжайте в том же духе!</p>
<div style="margin-top:30px">
<button class="btn btn-primary">Показать детали</button>
<button class="btn btn-secondary">Вернуться к тестам</button>
</div>
</div>
</div>
</body>
</html>
